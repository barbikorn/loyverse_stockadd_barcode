services:
  loyverse-sync:
    build: .
    container_name: loyverse_sync
    # โหลด secrets จาก .env (ไม่ embed ใน image)
    env_file:
      - .env
    volumes:
      # credentials.json (Service Account key)
      - ./credentials.json:/app/credentials.json:ro
      # output: barcodes + Excel reports จะถูก save ที่นี่
      - ./output:/app/output
    # รัน แล้วหยุดเมื่อเสร็จ (ไม่ใช่ long-running service)
    restart: "no"
