services:
  loyverse-ui:
    build: .
    container_name: loyverse_ui
    # โหลด secrets จาก .env (ไม่ embed ใน image)
    env_file:
      - .env
    ports:
      # เปิด Web UI ที่ http://localhost:5000
      - "5000:5000"
    volumes:
      # credentials.json (Service Account key)
      - ./credentials.json:/app/credentials.json:ro
      # output: barcodes + reports จะถูก save ที่นี่
      - ./output:/app/output
    # long-running web service — รีสตาร์ทเองถ้า container ล้ม
    restart: unless-stopped
